; Zen Mahjong Journey: AdMob application ids for Android exports, read by the
; plugin's export step (AdmobPlugin.gd writes the id into AndroidManifest.xml).
; is_real=true writes the [Release] id (our real AdMob app) into every APK/AAB,
; debug ones included. That is safe: which ads are served depends on the ad
; unit ids, and debug builds always request Google's test units (data/ads.json);
; only release builds use the real units (data/ads_release.json, whose app_id
; must match [Release] below). [Debug] is Google's sample app id, used only if
; is_real is set back to false.

[General]

is_real=true

[Debug]

app_id="ca-app-pub-3940256099942544~3347511713"

[Release]

app_id="ca-app-pub-9885070769172212~4955462052"
