<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#354f44">
		<title>$GODOT_PROJECT_NAME</title>
		<!--
			Zen Mahjong Journey web loading page (original). Based on Godot 4.7.2's
			full-size.html: the engine start-up script below is unchanged apart
			from driving this page's own progress bar. Selected as the Web preset's
			custom HTML shell (export_presets.cfg).
		-->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #f6eedf;
	background-color: #354f44;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen: forest green like the game's boot colour, so the hand-over
   to the title screen has no flash. */
#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 2.2rem;
	background: radial-gradient(ellipse at 50% 40%, #44614f 0%, #354f44 55%, #273b50 100%);
	font-family: Georgia, 'Noto Serif', 'Times New Roman', serif;
	transition: opacity 0.45s ease;
	z-index: 2;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#status.leaving {
	opacity: 0;
}

.title {
	text-align: center;
	line-height: 1;
	user-select: none;
}

.title .zen {
	display: block;
	font-size: clamp(3rem, 16vw, 5.5rem);
	color: #f6eedf;
	letter-spacing: 0.04em;
}

.title .mahjong {
	display: block;
	font-size: clamp(2.2rem, 12vw, 4.2rem);
	color: #c7a56a;
	letter-spacing: 0.08em;
	margin-top: 0.35rem;
}

.title .journey {
	display: block;
	font-size: clamp(0.9rem, 4vw, 1.25rem);
	color: #91a88c;
	letter-spacing: 0.6em;
	margin-top: 0.7rem;
	padding-left: 0.6em;
}

#loading {
	width: min(70vw, 340px);
	text-align: center;
}

#bar {
	height: 8px;
	border-radius: 4px;
	background: rgba(246, 238, 223, 0.18);
	overflow: hidden;
	position: relative;
}

#bar-fill {
	height: 100%;
	width: 0%;
	border-radius: 4px;
	background: linear-gradient(90deg, #c7a56a, #e8cf98);
	transition: width 0.25s ease;
}

/* No reliable size yet: a soft moving sheen instead of a fake percentage. */
#bar.unknown #bar-fill {
	width: 35%;
	animation: sheen 1.4s ease-in-out infinite;
}

@keyframes sheen {
	from { transform: translateX(-100%); }
	to { transform: translateX(290%); }
}

#loading-text {
	margin-top: 0.9rem;
	font-size: 1rem;
	color: rgba(246, 238, 223, 0.85);
	letter-spacing: 0.04em;
}

#status-notice {
	display: none;
	max-width: 30rem;
	margin: 0 1.5rem;
	padding: 1rem 1.2rem;
	border-radius: 0.75rem;
	border: 1px solid #c7a56a;
	background: rgba(39, 59, 80, 0.92);
	color: #f6eedf;
	font-family: 'Noto Sans', Arial, sans-serif;
	line-height: 1.4;
	text-align: center;
}

/* A few drifting petals, drawn with CSS (no images). */
.petal {
	position: absolute;
	top: -5vh;
	width: 14px;
	height: 10px;
	border-radius: 70% 0 70% 0;
	background: #e8b4bd;
	opacity: 0.75;
	animation: fall linear infinite;
	pointer-events: none;
}

@keyframes fall {
	0% { transform: translate(0, 0) rotate(0deg); }
	100% { transform: translate(18vw, 112vh) rotate(540deg); }
}

@media (prefers-reduced-motion: reduce) {
	.petal { display: none; }
	#bar.unknown #bar-fill { animation: none; width: 100%; opacity: 0.45; }
	#status { transition: none; }
}
		</style>
		<script>
// Browsers only allow sound after the player interacts with the page. Keep
// track of the game's audio contexts and resume them on the first tap or key
// press (usually the title screen's Play button), so no separate
// "Tap to Start" step is needed and nothing plays before the player acts.
(function () {
	const Base = window.AudioContext || window.webkitAudioContext;
	if (!Base) {
		return;
	}
	const contexts = [];
	class TrackedAudioContext extends Base {
		constructor(...args) {
			super(...args);
			contexts.push(this);
		}
	}
	window.AudioContext = TrackedAudioContext;
	window.webkitAudioContext = TrackedAudioContext;
	window.__zenAudioContexts = contexts;
	const unlock = function () {
		contexts.forEach((context) => {
			if (context.state === 'suspended') {
				context.resume();
			}
		});
	};
	['pointerdown', 'touchend', 'keydown'].forEach((type) => {
		window.addEventListener(type, unlock, { capture: true, passive: true });
	});
}());
// Load timings (milliseconds since navigation), for diagnosing slow starts.
window.__zenLoad = { downloaded: null, started: null };
		</script>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Zen Mahjong Journey needs JavaScript to run.
		</noscript>

		<div id="status">
			<div class="title" aria-label="Zen Mahjong Journey">
				<span class="zen">Zen</span>
				<span class="mahjong">MAHJONG</span>
				<span class="journey">JOURNEY</span>
			</div>
			<div id="loading" role="progressbar" aria-valuemin="0" aria-valuemax="100">
				<div id="bar" class="unknown"><div id="bar-fill"></div></div>
				<div id="loading-text">Preparing the garden…</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const loading = document.getElementById('loading');
	const bar = document.getElementById('bar');
	const barFill = document.getElementById('bar-fill');
	const loadingText = document.getElementById('loading-text');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;

	// Petals: a handful, spread out, with their own speeds.
	for (let i = 0; i < 7; i++) {
		const petal = document.createElement('div');
		petal.className = 'petal';
		petal.style.left = (8 + i * 13) + 'vw';
		petal.style.animationDuration = (9 + (i % 3) * 3) + 's';
		petal.style.animationDelay = (-i * 1.7) + 's';
		statusOverlay.appendChild(petal);
	}

	function hideStatus() {
		if (!initializing) {
			return;
		}
		initializing = false;
		statusOverlay.classList.add('leaving');
		setTimeout(() => statusOverlay.remove(), 500);
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		loading.style.display = 'none';
		statusNotice.style.display = 'block';
		initializing = false;
	}

	// Progress is shown as a percentage only when the total size is known;
	// otherwise the bar shows a soft moving sheen.
	function onProgress(current, total) {
		if (current > 0 && total > 0) {
			const percent = Math.min(100, Math.round((current / total) * 100));
			bar.classList.remove('unknown');
			barFill.style.width = percent + '%';
			loading.setAttribute('aria-valuenow', String(percent));
			loadingText.textContent = percent < 100 ? 'Preparing the garden… ' + percent + '%' : 'Almost there…';
			if (percent >= 100 && window.__zenLoad.downloaded === null) {
				window.__zenLoad.downloaded = Math.round(performance.now());
			}
		} else {
			bar.classList.add('unknown');
			loading.removeAttribute('aria-valuenow');
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'This browser is missing features the game needs:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': onProgress,
		}).then(() => {
			window.__zenLoad.started = Math.round(performance.now());
			hideStatus();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
